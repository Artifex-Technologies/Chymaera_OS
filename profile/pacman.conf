#
# /etc/pacman.conf for building the Chymaera Linux ISO
#
# Based on archiso's releng profile (archlinux/archiso configs/releng/pacman.conf),
# plus the [blackarch] and [chymaera] repos.
#
# NOTE: this file is consumed by mkarchiso running on the BUILD HOST, using
# the host's own pacman keyring. Before building, the host needs:
#   1. The BlackArch signing key + mirrorlist installed (see scripts/build.sh,
#      which runs BlackArch's official strap.sh for this).
#   2. A local [chymaera] repo built at repo/x86_64/ (see
#      scripts/build-local-packages.sh) — scripts/build.sh rewrites the
#      "Server" path below to an absolute path before invoking mkarchiso.

[options]
HoldPkg     = pacman glibc
Architecture = auto

ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Multilib (32-bit packages). Several BlackArch tools (e.g. yinjector,
# limelighter, thefatrat) depend on lib32-* packages, so this needs to be
# enabled rather than optional once BlackArch categories are in the mix.
[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch tooling. Installed by scripts/build.sh via BlackArch's strap.sh
# before mkarchiso runs, which writes the matching mirrorlist to
# /etc/pacman.d/blackarch-mirrorlist on the build host.
[blackarch]
SigLevel = PackageRequired
Include = /etc/pacman.d/blackarch-mirrorlist

# Locally built Chymaera packages (sarina-git, etc.). The
# Server path below is a placeholder — scripts/build.sh substitutes it with
# an absolute path to repo/x86_64 in a work copy before building; this file
# is left path-independent so the repo stays portable across checkouts.
[chymaera]
SigLevel = Optional TrustAll
Server = file://@@CHYMAERA_REPO_DIR@@
