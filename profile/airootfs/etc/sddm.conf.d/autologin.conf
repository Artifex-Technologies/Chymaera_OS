# Log the live user straight into Plasma. The account has no password (see
# sysusers.d/live.conf); sddm-autologin's PAM stack is pam_permit, so no
# password is required, but pam_shells means the login shell must appear in
# /etc/shells -- /usr/bin/bash does.
#
# "plasma" is /usr/share/wayland-sessions/plasma.desktop. The image ships no
# X11 session, so this name must stay in step with what plasma-meta installs.
[Autologin]
User=live
Session=plasma
