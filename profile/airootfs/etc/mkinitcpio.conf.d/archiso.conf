# Verbatim from archiso's releng profile
# (archlinux/archiso configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf).
# Without the archiso* hooks the live medium cannot find/mount the squashfs
# airootfs and the ISO panics at boot. Re-sync when bumping archiso.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
