# Turn the freshly unpacked live image into an installable system.
#
# Runs inside the target (dontChroot: false). The script is in the unpacked
# squashfs, so it is already there to run. It must come right after unpackfs
# and before initcpiocfg/initcpio/users/displaymanager, because those read what
# it removes.
#
# timeout is generous: on a cold disk the keyring step can take a while.
---
dontChroot: false
timeout: 300
verbose: true
script:
    - "/usr/local/bin/chymaera-install-cleanup"
