# Unpack the live medium's root filesystem onto the target.
#
# Upstream's default for this file points at ../CHANGES and the slideshow QML
# (developer samples), so without this override the installer copies nothing
# useful.
#
# Path: archiso mounts the ISO at /run/archiso/bootmnt, and mkarchiso puts the
# image at <install_dir>/<arch>/airootfs.sfs. Our install_dir is "chymaera"
# (profile/profiledef.sh), NOT archiso's default "arch", so the path most
# Arch-installer examples use is wrong here. Keep this in step with install_dir.
#
# squashfs is mounted and rsynced, so install time is bounded by decompression
# and disk writes. That is why profiledef.sh uses zstd for the image.
---
unpack:
    -   source: "/run/archiso/bootmnt/chymaera/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
