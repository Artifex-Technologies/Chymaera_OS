# Calamares job sequence for Chymaera Linux.
#
# Derived from the settings.conf in the Calamares 3.4.2 source tarball. Two
# differences from upstream, both load-bearing:
#
#   * `initramfs` is not in the sequence. packages/pkgbuilds/calamares/PKGBUILD
#     builds with -DSKIP_MODULES=initramfs (that module is for mkinitfs/dracut
#     systems), so listing it makes Calamares fail at startup. `initcpio` and
#     `initcpiocfg` are the Arch ones and stay.
#   * `shellprocess@cleanup` runs straight after `unpackfs`. See
#     modules/shellprocess_cleanup.conf and /usr/local/bin/chymaera-install-cleanup.
#
# The install is a copy of the live squashfs (`unpackfs`), not a pacstrap. That
# is the speed model: no package resolution, no download, and it works with no
# network, which the project needs. See docs/INSTALLER.md.
---
modules-search: [ local ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@cleanup
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: default

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
