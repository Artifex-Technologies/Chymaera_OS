# Live-session user.
#
# Created via sysusers.d rather than by shipping airootfs/etc/passwd the way
# archiso's releng profile does: mkarchiso copies airootfs over the pacstrapped
# root and does NOT re-run systemd-sysusers, so a hand-written passwd would
# delete every service account the image already has -- including sddm (uid
# 954), which would break the greeter. systemd-sysusers.service runs at boot,
# before sysinit.target, so the account exists well before SDDM starts.
u live 1000 "Chymaera Live Session" /home/live /usr/bin/bash
m live wheel
